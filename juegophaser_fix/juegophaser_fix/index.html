<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hábitos Saludables</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg,#f0e6ff 0%,#ffe6f5 50%,#e6f0ff 100%);
      display:flex; justify-content:center; align-items:center;
      min-height:100vh; overflow:hidden; font-family:"Segoe UI",Arial,sans-serif;
    }
    #game-container { border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(100,0,200,.15); }
    canvas { display:block; }

    #loading-screen {
      position:fixed; inset:0;
      background:linear-gradient(135deg,#f0e6ff 0%,#ffe6f5 100%);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:18px; z-index:9999;
      transition:opacity .5s ease;
    }
    #loading-screen.hidden { opacity:0; pointer-events:none; }
    .spinner {
      width:52px; height:52px;
      border:5px solid #ede9fe; border-top-color:#7c3aed;
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-title { font-size:26px; font-weight:700; color:#7c3aed; }
    .loading-sub   { font-size:14px; color:#a78bda; }
    input::placeholder { color:#c4b5d8; }
    input:focus { outline:none; }
    input { font-family:"Segoe UI",Arial,sans-serif !important; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div style="font-size:54px">⭐</div>
    <div class="loading-title">Hábitos Saludables</div>
    <div class="spinner"></div>
    <div class="loading-sub">Preparando el juego...</div>
  </div>

  <div id="game-container"></div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const ls = document.getElementById('loading-screen');
        if (ls) { ls.classList.add('hidden'); setTimeout(() => ls.remove(), 600); }
      }, 900);
    });
    window.addEventListener('error', e => console.error('Error:', e.message, e.filename, e.lineno));
  </script>

  <!-- Un solo archivo JS sin módulos ES6 — funciona con file:// y http:// -->
  <script src="game.js"></script>
</body>
</html>
